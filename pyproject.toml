[tool.ruff]
# Keep in sync with the Python version in the Dockerfile.
target-version = "py312"
line-length = 100
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
# Default ruff rule set (pycodestyle errors + pyflakes) plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # Long f-strings/log lines are common in this codebase; line length is
    # enforced by the formatter, not the linter.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# ``legacy.py`` is the pre-refactor monolith kept for reference only.
"src/legacy.py" = ["E7", "F", "I"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
# ``src`` modules use flat imports (``from navidrome import Navidrome``), so
# the source folder has to be importable without installing the project.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true
# Pre-refactor dead code, not imported by the app.
omit = ["src/legacy.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pass",
]
